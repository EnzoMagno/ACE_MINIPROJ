; ACE_MINIPROJ - line follower with encoders + FreeRTOS on the Raspberry Pi Pico W
;
; FreeRTOS: the arduino-pico core (earlephilhower) already ships FreeRTOS SMP.
; Nothing to install: the build flag below turns it on and the sources only
; need  #include <FreeRTOS.h>.
; The official "raspberrypi" platform uses the Mbed core (no FreeRTOS), so the
; maxgerhardt platform is required. PlatformIO downloads it on the first build.

[env:rpipicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

build_flags =
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS

monitor_speed = 115200
